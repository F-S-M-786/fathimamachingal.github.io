 <!DOCTYPE html>
<html>
<head>
<title>Gallery</title>

<style>
body{font-family:Arial; text-align:center;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:40px;
}

.card{
  border:1px solid #ddd;
  border-radius:10px;
  overflow:hidden;
}

.card img{
  width:100%;
}

.card a{
  text-decoration:none;
  color:black;
}
</style>
</head>

<body>

<h1>Summer School Gallery</h1>

<div class="grid">

  <div class="card">
    <a href="gallery/SEAP_2025/index.html">
      <img src="iit.jpeg">
      <p>SEAP 2025</p>
    </a>
  </div>

  <div class="card">
    <a href="gallery/SCHOOL2/index.html">
      <img src="shifa.jpeg">
      <p>School 2</p>
    </a>
  </div>

</div>

</body>
</html>
