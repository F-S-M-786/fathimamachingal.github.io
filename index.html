<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fathima Shifa</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter', sans-serif;
  background:#0f0f0f;
  color:white;
}

/* NAVBAR */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px 60px;
  position:fixed;
  width:100%;
  top:0;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
}

nav .left{
  font-weight:600;
  font-size:18px;
}

nav a{
  color:white;
  text-decoration:none;
  margin:0 15px;
  font-weight:300;
}

nav a:hover{
  opacity:0.7;
}

/* HERO */
.hero{
  height:100vh;
  background:url('gem.png') center/cover;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.5);
}

.hero-content{
  position:relative;
  max-width:700px;
}

.profile{
  width:140px;
  height:140px;
  border-radius:50%;
  border:3px solid white;
  margin-bottom:20px;
}

h1{
  font-size:50px;
  margin:10px 0;
}

h1 span{
  color:#ffb347;
}

p{
  font-size:18px;
  opacity:0.8;
}

/* BUTTONS */
.btns{
  margin-top:20px;
}

.btns a{
  display:inline-block;
  padding:10px 20px;
  border:1px solid white;
  margin:5px;
  text-decoration:none;
  color:white;
  border-radius:6px;
  transition:0.3s;
}

.btns a:hover{
  background:white;
  color:black;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
  <div class="left">Fathima Shifa</div>
  <div class="right">
    <a href="#">Home</a>
    <a href="#">Physics</a>
    <a href="#">Music</a>
    <a href="gallery.html">Gallery</a>
    <a href="cv.pdf" target="_blank">CV</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">

  <div class="hero-content">

    <img class="profile" src="shifa.jpeg">

    <h1>Hello, I'm <span>Fathima Shifa</span></h1>

    <p>Physics Student | Research Enthusiast</p>

    <div class="btns">
      <a href="gallery.html">View Gallery</a>
      <a href="cv.pdf" target="_blank">Download CV</a>
    </div>

  </div>

</div>

</body>
</html>
