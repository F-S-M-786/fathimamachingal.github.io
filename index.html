<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fathima Shifa</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  scroll-behavior: smooth;
}

/* NAVBAR */
.navbar {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  padding: 15px 0;
  z-index: 1000;
}

.navbar a {
  color: white;
  margin: 0 20px;
  text-decoration: none;
  font-weight: bold;
}

.navbar a:hover {
  color: #00ffd5;
}

/* HERO */
.hero {
  height: 100vh;
  background-image: url('gem.png');
  background-size: cover;
  background-position: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: white;
  position: relative;
}

.hero::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
}

.hero > * {
  position: relative;
}

.profile {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: 4px solid white;
  object-fit: cover;
  margin-bottom: 20px;
}

h1 {
  font-size: 50px;
  margin: 10px 0;
}

p {
  font-size: 20px;
}

/* SECTIONS */
.section {
  padding: 100px 20px;
  text-align: center;
}

#research {
  background: #f5f5f5;
}

#cv {
  background: #ffffff;
}

#contact {
  background: #f5f5f5;
}

h2 {
  font-size: 35px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <a href="#home">Home</a>
  <a href="#research">Research</a>
  <a href="#cv">CV</a>
  <a href="#contact">Contact</a>
</div>

<!-- HERO -->
<div class="hero" id="home">

  <img class="profile" src="shifa.jpeg">

  <h1>Hello, I'm Fathima Shifa</h1>
  <p>Physics Student | Research Enthusiast</p>

</div>

<!-- RESEARCH -->
<div class="section" id="research">
  <h2>Research</h2>
  <p>Write your physics research details here.</p>
</div>

<!-- CV -->
<div class="section" id="cv">
  <h2>CV</h2>
  <p>Add your CV download link here.</p>
</div>

<!-- CONTACT -->
<div class="section" id="contact">
  <h2>Contact</h2>
  <p>Email: yourmail@example.com</p>
</div>

</body>
</html>
