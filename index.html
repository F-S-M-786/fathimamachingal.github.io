<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fathima Shifa</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .hero {
      height: 100vh;
      background-image: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }

    .profile {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid white;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 45px;
      margin: 10px 0;
    }

    p {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .buttons a {
      text-decoration: none;
      padding: 10px 20px;
      margin: 5px;
      border: 2px solid white;
      color: white;
      border-radius: 5px;
    }

    .buttons a:hover {
      background: white;
      color: black;
    }
  </style>
</head>

<body>

  <div class="hero">

    <img class="profile" src="https://i.imgur.com/8Km9tLL.jpg">

    <h1>Hello, I'm Fathima Shifa</h1>
    <p>Physics Student | Research Enthusiast</p>

    <div class="buttons">
      <a href="#">Research</a>
      <a href="#">CV</a>
      <a href="#">Contact</a>
    </div>

  </div>

</html>
