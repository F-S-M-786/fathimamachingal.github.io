<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fathima Shifa</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* HERO SECTION */
    .hero {
      height: 100vh;
      background-image: url('gem.png');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      position: relative;
    }

    /* DARK OVERLAY */
    .hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
    }

    .hero > * {
      position: relative;
    }

    /* PROFILE IMAGE */
    .profile {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 4px solid white;
      margin-bottom: 20px;
      object-fit: cover;
    }

    /* NAME */
    h1 {
      font-size: 50px;
      margin: 10px 0;
    }

    /* SUBTITLE */
    p {
      font-size: 20px;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    /* BUTTONS */
    .buttons a {
      text-decoration: none;
      padding: 10px 20px;
      margin: 5px;
      border: 2px solid white;
      color: white;
      border-radius: 5px;
      transition: 0.3s;
      display: inline-block;
    }

    .buttons a:hover {
      background: white;
      color: black;
    }
  </style>
</head>

<body>

  <div class="hero">

    <!-- YOUR IMAGE -->
    <img class="profile" src="shifa.jpeg">

    <!-- TEXT -->
    <h1>Hello, I'm Fathima Shifa</h1>
    <p>Physics Student | Research Enthusiast</p>

    <!-- BUTTONS -->
    <div class="buttons">

      <a href="#">Research</a>

      <!-- CV DOWNLOAD BUTTON -->
      <a href="cv.pdf" target="_blank" download>
        Download CV
      </a>

      <a href="#">Contact</a>

    </div>

  </div>

</body>
</html>
