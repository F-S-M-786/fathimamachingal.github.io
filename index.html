<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Fathima Shifa</title>

<!-- MODERN FONT -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Montserrat',sans-serif;
}

/* NAVBAR */

nav{
    background:white;
    height:78px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 90px;
    box-sizing:border-box;
}

.logo{
    font-size:22px;
    font-weight:700;
    color:#263548;
}

nav ul{
    list-style:none;
    display:flex;
    gap:38px;
    margin:0;
    padding:0;
}

nav a{
    text-decoration:none;
    color:#222;
    font-size:18px;
    font-weight:500;
    transition:.3s;
}

nav a:hover{
    color:#2c8cff;
}

/* HERO */

.hero{
    height:calc(100vh - 78px);

    background-image:url('gem.png');
    background-size:cover;
    background-position:center;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    color:white;
    position:relative;
}

.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.45);
}

.hero>*{
    position:relative;
}

/* PROFILE */

.profile{
    width:175px;
    height:175px;
    border-radius:50%;
    border:4px solid white;
    object-fit:cover;
    margin-bottom:22px;
}

/* MAIN TITLE */

h1{
    font-size:68px;
    font-weight:800;
    margin:10px 0 15px 0;
    text-shadow:2px 2px 6px rgba(0,0,0,0.45);
}

/* SUBTITLE */

p{
    font-size:22px;
    font-weight:400;
    margin-bottom:32px;
    opacity:0.95;
}

/* BUTTONS */

.buttons a{
    text-decoration:none;
    color:white;

    border:2px solid white;

    padding:14px 28px;

    margin:7px;

    border-radius:4px;

    display:inline-block;

    font-size:18px;
    font-weight:600;

    transition:.3s;
}

.buttons a:hover{
    background:white;
    color:black;
}

</style>
</head>

<body>

<!-- NAVBAR -->

<nav>

<div class="logo">
Fathima Shifa
</div>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Research</a></li>
<li><a href="#">Contact</a></li>
<li><a href="cv.pdf" target="_blank">Download CV</a></li>
</ul>

</nav>

<!-- HERO SECTION -->

<div class="hero">

<img class="profile" src="shifa.jpeg">

<h1>Hello, I'm Fathima Shifa</h1>

<p>Physics Student | Research Enthusiast</p>

<div class="buttons">

<a href="#">Research</a>

<a href="cv.pdf" target="_blank">Download CV</a>

<a href="#">Contact</a>

</div>

</div>

</body>
</html>
