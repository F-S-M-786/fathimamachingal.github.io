<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fathima Shifa</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      scroll-behavior: smooth;
    }

    /* HERO SECTION */
    .hero {
      height: 100vh;
      background-image: url('gem.png');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
    }

    .hero > * {
      position: relative;
    }

    .profile {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 4px solid white;
      margin-bottom: 20px;
      object-fit: cover;
    }

    h1 {
      font-size: 50px;
      margin: 10px 0;
    }

    p {
      font-size: 20px;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    .buttons a {
      text-decoration: none;
      padding: 10px 20px;
      margin: 5px;
      border: 2px solid white;
      color: white;
      border-radius: 5px;
      transition: 0.3s;
      display: inline-block;
    }

    .buttons a:hover {
      background: white;
      color: black;
    }

    /* RESEARCH SECTION */
    #research {
      padding: 80px;
      background: #f5f5f5;
      text-align: center;
    }

    #research h2 {
      font-size: 40px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <div class="hero">

    <img class="profile" src="shifa.jpeg">

    <h1>Hello, I'm Fathima Shifa</h1>
    <p>Physics Student | Research Enthusiast</p>

    <div class="buttons">

      <!-- Scroll to research -->
      <a href="#research">Research</a>

      <!-- Download CV -->
      <a href="cv.pdf" download target="_blank">Download CV</a>

      <!-- Contact placeholder -->
      <a href="#">Contact</a>

    </div>

  </div>

  <!-- RESEARCH SECTION -->
  <div id="research">
    <h2>My Research</h2>
    <p>
      Here you can add your physics research, projects, papers, and achievements.
    </p>
  </div>

</body>
</html>
